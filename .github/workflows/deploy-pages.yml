name: Deploy frontend a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Configurar Pages (activa Pages si no lo está)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          static_site_generator: next
          generator_config_file: frontend/next.config.mjs

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build estático
        working-directory: frontend
        env:
          # Definir en Settings → Secrets and variables → Actions → Variables
          # con la URL del backend en Cloud Run (https://...run.app)
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://calcuol-git-221854109597.europe-west1.run.app' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
